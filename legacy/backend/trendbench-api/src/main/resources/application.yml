spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trendbench
    username: trendbench
    password: trendbench
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

clickhouse:
  jdbc-url: jdbc:clickhouse://localhost:8123/trendbench
  username: trendbench
  password: trendbench

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:trendbench-dev-secret-please-override-in-production-please-be-at-least-32-bytes}
  expiration-ms: 3600000
  issuer: trendbench