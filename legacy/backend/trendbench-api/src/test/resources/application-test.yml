spring:
  datasource:
    url: jdbc:h2:mem:trendbench-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false

clickhouse:
  jdbc-url: jdbc:clickhouse://localhost:8123/trendbench
  username: trendbench
  password: trendbench

jwt:
  secret: test-jwt-secret-key-must-be-at-least-32-bytes-long-aaaaaaaaaa
  expiration-ms: 3600000
  issuer: trendbench-test

server:
  port: 0
